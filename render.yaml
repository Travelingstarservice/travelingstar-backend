services:
  - type: web
    name: travelingstar-backend
    env: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ADMIN_PIN
        value: 2580
      - key: JWT_SECRET_KEY
        value: replace-with-a-long-random-secret
      - key: CORS_ALLOWED_ORIGINS
        value: '*'