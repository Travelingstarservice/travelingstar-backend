services:
  - type: web
    name: travelingstar-backend
    env: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ADMIN_PIN
        value: 2580
      - key: JWT_SECRET_KEY
        value: replace-with-a-long-random-secret
      - key: CORS_ALLOWED_ORIGINS
        value: '*'
      - key: SQLITE_PATH
        value: /tmp/travelingstar/database.db
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '1'
      - key: DB_POOL_TIMEOUT
        value: '30'
      - key: DB_POOL_RECYCLE
        value: '280'