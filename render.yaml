services:
  - type: web
    name: travelingstar-backend
    env: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # ADMIN_PIN and JWT_SECRET_KEY must be set as secret environment variables
      # in the Render dashboard — do NOT commit real values here.
      # ADMIN_PIN: 4-digit PIN, must not be a common weak value (e.g. 1234).
      # JWT_SECRET_KEY: long random string (e.g. openssl rand -hex 32).
      - key: CORS_ALLOWED_ORIGINS
        value: '*'
      - key: SQLITE_PATH
        value: /tmp/travelingstar/database.db
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '1'
      - key: DB_POOL_TIMEOUT
        value: '30'
      - key: DB_POOL_RECYCLE
        value: '280'
